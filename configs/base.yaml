seed: 42
data:
  kaggle_handle: meowmeowmeowmeowmeow/gtsrb-german-traffic-sign
  raw_dir: data/raw/gtsrb
  train_csv: Train.csv

image:
  size: [48, 48]
  channels: 3

dataset:
  num_classes: 43
  extensions: [".png"]

input_data:
  processed_dir : data/processed/output_images.npz

split:
  val_ratio: 0.2

model:
  name: "CNN"

train:
  model_output_dir: models/CNN
  data_dir: data/processed
  epochs: 15
  batch_size: 32
