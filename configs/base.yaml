seed: 42
data:
  kaggle_handle: meowmeowmeowmeowmeow/gtsrb-german-traffic-sign
  raw_dir: data/raw/gtsrb
  processed_dir: data/processed/train   # NEW (dossier utilisé pour mean/std)
  train_csv: Train.csv
  test_csv: Test.csv
  epochs: 8

image:
  size: [48, 48]
  channels: 3

dataset:
  num_classes: 43
  batch_size: 32
  extensions: [".png"]
  target_per_class: 2000  # Nombre d'images par classe après augmentation

# Données traitées, prêtes à être utilisées pour l'entraînement du modèle
input_data:
  processed_dir : data/processed/train/output_images.npz

# Modèle
model:
  name: "baseline_MLP"
  type: "baseline"
  dir: models/baseline                           #

split:
  val_ratio: 0.2

# Configuration du rapports et des plots de résultats
reports:
  result_dir: reports/model_metrics
  save_plots: True