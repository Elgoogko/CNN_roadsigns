seed: 42
data:
  kaggle_handle: meowmeowmeowmeowmeow/gtsrb-german-traffic-sign
  raw_dir: data/raw/gtsrb
  processed_dir: data/processed/train_augmented
  train_csv: Train.csv
  test_csv: Test.csv
  epochs: 10

image:
  size: [43, 43]
  channels: 3

dataset:
  num_classes: 43
  batch_size: 32
  extensions: [".png"]
  target_per_class: 2000  # Nombre d'images par classe après augmentation

# Données traitées, prêtes à être utilisées pour l'entraînement du modèle
input_data:
  processed_dir : data/processed/train_augmented/output_images.npz

# Modèle
model:
  name: "db_aug"
  type: "cnn"
  dir: models/experience/db_aug

split:
  val_ratio: 0.2

# Configuration du rapports et des plots de résultats
reports:
  result_dir: reports/model_metrics/experiences
  save_plots: True